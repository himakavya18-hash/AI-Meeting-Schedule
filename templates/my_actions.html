{% extends 'base.html' %}
{% block title %}My Action Items - AI Meeting Portal{% endblock %}
{% block page_title %}My Assigned Action Items{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <div class="card-title">🎯 Tasks Assigned to Me</div>
  </div>
  <div id="my-actions-container" style="display:flex;flex-direction:column;gap:1rem;">
    <div style="text-align:center;color:var(--text-muted);padding:2rem;">Loading your tasks...</div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    await loadMyActions();
  });

  async function loadMyActions() {
    const container = document.getElementById('my-actions-container');
    try {
      const actions = await api.get('/actions/my/');

      if (actions.length === 0) {
        container.innerHTML = `
          <div style="text-align:center;color:var(--text-muted);padding:3rem;">
            <p>🎉 You have no pending action items assigned!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = actions.map(a => `
        <div style="background:var(--bg-dark);border:1px solid var(--border-color);border-radius:10px;padding:1.25rem;display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:700;font-size:1.05rem;color:#fff;margin-bottom:0.3rem;">${a.task}</div>
            <div style="font-size:0.85rem;color:var(--text-muted);">
              Meeting: <a href="/meetings/${a.meeting}/" style="color:var(--primary);">${a.meeting_title || 'Meeting #'+a.meeting}</a> • 
              Deadline: <strong>${a.deadline}</strong> • Priority: <span style="color:var(--accent-cyan);">${a.priority}</span>
            </div>
            ${a.evidence ? `<div style="font-size:0.8rem;color:var(--text-muted);font-style:italic;margin-top:0.4rem;">Quote: "${a.evidence}"</div>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <select onchange="updateMyStatus(${a.id}, this.value)" class="form-control" style="width:auto;padding:0.4rem;font-weight:600;">
              <option value="Pending" ${a.status==='Pending'?'selected':''}>Pending</option>
              <option value="In Progress" ${a.status==='In Progress'?'selected':''}>In Progress</option>
              <option value="Completed" ${a.status==='Completed'?'selected':''}>Completed</option>
            </select>
          </div>
        </div>
      `).join('');
    } catch (e) {
      container.innerHTML = `<p style="color:var(--danger);">Error loading tasks: ${e.message}</p>`;
    }
  }

  async function updateMyStatus(id, val) {
    await api.put(`/actions/${id}/`, { status: val });
    loadMyActions();
  }
</script>
{% endblock %}
