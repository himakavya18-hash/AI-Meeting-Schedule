{% extends 'base.html' %}
{% block title %}Unresolved Questions - AI Meeting Portal{% endblock %}
{% block page_title %}Unresolved Meeting Questions Board{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <div class="card-title">❓ Unresolved Questions Tracker</div>
  </div>
  <div id="questions-board" style="display:flex;flex-direction:column;gap:1rem;">
    <div style="text-align:center;color:var(--text-muted);padding:2rem;">Loading questions...</div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    await loadQuestions();
  });

  async function loadQuestions() {
    const board = document.getElementById('questions-board');
    try {
      const questions = await api.get('/actions/questions/');
      if (questions.length === 0) {
        board.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:2rem;">No questions extracted yet.</div>`;
        return;
      }

      board.innerHTML = questions.map(q => `
        <div style="background:var(--bg-dark);border:1px solid var(--border-color);border-radius:10px;padding:1.25rem;display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:700;font-size:1rem;color:#fff;margin-bottom:0.3rem;">${q.question}</div>
            <div style="font-size:0.8rem;color:var(--text-muted);">
              Status: <span class="badge badge-${q.status==='Resolved'?'completed':'pending'}">${q.status}</span>
              ${q.resolved_by ? ` • Resolved by: ${q.resolved_by.full_name || q.resolved_by.username}` : ''}
            </div>
            ${q.resolution_notes ? `<div style="font-size:0.8rem;color:var(--success);margin-top:0.3rem;">Resolution Note: ${q.resolution_notes}</div>` : ''}
          </div>
          <button onclick="toggleQuestion(${q.id}, '${q.status==='Resolved'?'Unresolved':'Resolved'}')" class="btn btn-secondary" style="font-size:0.8rem;">
            ${q.status==='Resolved' ? 'Re-open Question' : 'Mark as Resolved'}
          </button>
        </div>
      `).join('');
    } catch (e) {
      console.error(e);
    }
  }

  async function toggleQuestion(id, newStatus) {
    let notes = '';
    if (newStatus === 'Resolved') {
      notes = prompt('Add optional resolution notes:');
    }
    await api.put(`/actions/questions/${id}/`, { status: newStatus, resolution_notes: notes });
    loadQuestions();
  }
</script>
{% endblock %}
