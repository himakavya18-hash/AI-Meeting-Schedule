{% extends 'base.html' %}
{% block title %}Notifications - AI Meeting Portal{% endblock %}
{% block page_title %}In-App Notification Center{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <div class="card-title">🔔 Notifications</div>
    <button onclick="markAllRead()" class="btn btn-secondary" style="font-size:0.8rem;">Mark All as Read</button>
  </div>
  <div id="notifications-list" style="display:flex;flex-direction:column;gap:0.75rem;">
    <div style="text-align:center;color:var(--text-muted);padding:2rem;">Loading notifications...</div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    await loadNotifications();
  });

  async function loadNotifications() {
    const list = document.getElementById('notifications-list');
    try {
      const res = await api.get('/notifications/');
      if (res.notifications.length === 0) {
        list.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:2rem;">No notifications found.</div>`;
        return;
      }

      list.innerHTML = res.notifications.map(n => `
        <div style="background:var(--bg-dark);border:1px solid ${n.is_read ? 'var(--border-color)' : 'var(--primary)'};border-radius:8px;padding:1rem;display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:700;font-size:0.95rem;color:#fff;">${n.title}</div>
            <div style="font-size:0.85rem;color:var(--text-muted);margin-top:2px;">${n.message}</div>
            <div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">${new Date(n.created_at).toLocaleString()}</div>
          </div>
          ${n.link ? `<a href="${n.link}" class="btn btn-secondary" style="font-size:0.75rem;">Open</a>` : ''}
        </div>
      `).join('');
    } catch (e) {
      console.error(e);
    }
  }

  async function markAllRead() {
    await api.post('/notifications/read-all/', {});
    loadNotifications();
    loadNotificationsBadge();
  }
</script>
{% endblock %}
