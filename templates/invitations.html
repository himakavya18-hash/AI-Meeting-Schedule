{% extends 'base.html' %}
{% block title %}Invitations - AI Meeting Portal{% endblock %}
{% block page_title %}Pending Meeting Invitations{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <div class="card-title">📩 Meeting Invitations</div>
  </div>
  <div id="invitations-list" style="display:flex;flex-direction:column;gap:1rem;">
    <div style="text-align:center;color:var(--text-muted);padding:2rem;">Loading invitations...</div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const meetings = await api.get('/meetings/');
      const container = document.getElementById('invitations-list');

      const pending = meetings.filter(m => m.status === 'Pending Confirmation' || m.status === 'Scheduled');
      if (pending.length === 0) {
        container.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:2rem;">No pending invitations.</div>`;
        return;
      }

      container.innerHTML = pending.map(m => `
        <div style="background:var(--bg-dark);border:1px solid var(--border-color);border-radius:10px;padding:1.25rem;display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:700;font-size:1.1rem;color:#fff;">${m.title}</div>
            <div style="font-size:0.85rem;color:var(--text-muted);margin-top:2px;">Organized by ${m.organizer.full_name || m.organizer.username} • ${m.date} (${m.start_time.substring(0,5)} - ${m.end_time.substring(0,5)})</div>
          </div>
          <a href="/meetings/${m.id}/" class="btn btn-primary">Respond</a>
        </div>
      `).join('');
    } catch (e) {
      console.error(e);
    }
  });
</script>
{% endblock %}
